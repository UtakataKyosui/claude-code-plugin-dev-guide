name: Plugin CI

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Check synchronized references and package boundaries
        run: |
          node scripts/sync-plugin-docs.mjs --check
          node scripts/check-plugin.mjs
      - name: Require a Plugin version bump when Plugin files change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-version-change.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate marketplace and plugin schema
        run: |
          claude plugin validate .
          claude plugin validate ./plugins/plugin-dev-guide
